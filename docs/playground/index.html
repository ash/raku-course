<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting to raku.online/play</title>
<meta name="robots" content="noindex">
<!-- The course playground is now a single, shared instance at raku.online/play,
     so there is only one version to maintain. This page forwards visitors there,
     carrying any query string and #fragment so existing share links keep
     working: course.raku.org/playground/#code=… → raku.online/play/#code=… , and
     ?gh= / ?gist= / ?url= / &run / &stdin are preserved too. -->
<script>
  location.replace('https://raku.online/play/' + location.search + location.hash);
</script>
<!-- Fallback if JavaScript is disabled (can't carry the #fragment, but gets you there). -->
<meta http-equiv="refresh" content="0; url=https://raku.online/play/">
</head>
<body></body>
</html>
